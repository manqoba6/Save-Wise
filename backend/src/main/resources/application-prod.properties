# Used with SPRING_PROFILES_ACTIVE=prod. Nothing here has a default: a missing secret stops the app from starting
# instead of silently falling back to something guessable.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

app.cookie.secure=${COOKIE_SECURE:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX:10}

# trust X-Forwarded-For from the reverse proxy in front (so rate limiting sees real client IPs)
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
logging.level.com.savewise=INFO

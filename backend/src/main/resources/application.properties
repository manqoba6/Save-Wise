spring.application.name=savewise

# Optional local overrides (git-ignored), e.g. your own database password
spring.config.import=optional:classpath:application-local.properties
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/savewise_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Must be at least 32 characters. Override with the JWT_SECRET env variable in any real environment.
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

spring.servlet.multipart.max-file-size=5MB
logging.level.com.savewise=INFO

# Profile pictures are stored on local disk (use object storage in production)
app.upload-dir=${UPLOAD_DIR:uploads/profile-pictures}
spring.servlet.multipart.max-request-size=6MB

# Used to build the link in password-reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset-minutes=60

# Recurring transactions: "today" is evaluated in this time zone; the job runs daily at 00:05 (also once on startup)
app.timezone=${APP_TIMEZONE:Africa/Johannesburg}
app.recurring.cron=0 5 0 * * *

# Refresh-token cookie: Secure should be true whenever the site is served over HTTPS (it is in the prod profile)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Strict

# Attempts allowed per IP per window on login, register, forgot- and reset-password.
# Generous here so development and Postman runs are not blocked; the prod profile tightens it.
app.rate-limit.max-requests=${RATE_LIMIT_MAX:100}
app.rate-limit.window-seconds=60

# Serves the React app and forwards /api to the Spring Boot container, so the browser only ever talks to ONE
# origin. That is what lets the login cookie be SameSite=Strict and means the API needs no CORS settings.

# if a proxy in front already terminated HTTPS, pass its protocol on; otherwise use ours
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;                 # profile pictures are limited to 2 MB; leave headroom for the form

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (declared once, here, so no location block below may use add_header or they would be dropped)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # fingerprinted files can be cached for a year; index.html must always be re-checked
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }

    # any other path is a page inside the React app
    location / {
        try_files $uri /index.html;
    }
}
